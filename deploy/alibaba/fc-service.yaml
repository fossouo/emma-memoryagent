# Alibaba Cloud Function Compute service definition (Serverless Devs format).
# Deploy with: s -t fc-service.yaml deploy -y   (requires `s config add` with
# an Alibaba Cloud AccessKey configured first — see README.md).
#
# This is the "Proof of Alibaba Cloud Deployment" artifact required by the
# hackathon rules: it defines the backend (Agent Firewall + Memory Store +
# Qwen Cloud client, src/main.py) as an Alibaba Cloud Function Compute
# service, fronted by an HTTP trigger.
#
# Custom Runtime mode: FC proxies HTTP to our own uvicorn process on caPort.
# Dependencies are vendored into vendor/ (Linux wheels, see build.sh) rather
# than relying on a Docker build step.
#
# NOTE: fc3 component v0.1.22 validates functionName/runtime/triggers etc.
# at the PROPS ROOT, not nested under function:/triggers: sub-keys (despite
# what older fc3 docs/examples show) — confirmed via schema.json validation
# errors during deploy.
#
# QWEN_CLOUD_API_KEY is injected at deploy time from the deployer's
# environment via ${env(...)} — the secret is NEVER stored in this repo.
# Export it before deploying (read from a local, gitignored key file), e.g.:
#   export QWEN_CLOUD_API_KEY="$(cat /path/to/keyfile)" && s deploy -y
# Founder-approved 2026-07-03 to persist as an FC function env var.

edition: 3.0.0
name: emma-memoryagent
access: default

resources:
  emma-memoryagent-service:
    component: fc3
    props:
      region: eu-west-1
      description: "Emma MemoryAgent - Qwen Cloud hackathon backend (Agent Firewall + memory + Qwen Cloud client)"
      service:
        name: emma-memoryagent-svc
        internetAccess: true
      functionName: emma-memoryagent-api
      runtime: custom.debian10
      caPort: 9000
      code: ../../
      memorySize: 1024
      cpu: 1
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10
      environmentVariables:
        QWEN_CLOUD_MODEL: qwen-plus
        QWEN_CLOUD_API_KEY: ${env(QWEN_CLOUD_API_KEY)}
        # FC mounts the code dir read-only; /tmp is the only writable path.
        EMMA_DB_PATH: /tmp/memory.sqlite3
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
